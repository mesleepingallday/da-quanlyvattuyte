<title>Kho Vật tư BV Phú Nhuận</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --primary:#0E7C86;--primary-strong:#0A626A;--primary-soft:#E3F2F3;--on-primary:#fff;
  --bg:#F4F7F7;--surface:#FFFFFF;--surface-2:#F8FAFA;--border:#DCE4E5;--text:#15272B;--muted:#5B6E72;
  --s-draft:#6B7A7D;--s-wait:#B7791F;--s-ok:#2B6CB0;--s-done:#2F855A;--s-bad:#C53030;--s-warn:#DD6B20;
  --s-wait-bg:#FBF3E4;--s-ok-bg:#E8F0FA;--s-done-bg:#E6F4EC;--s-bad-bg:#FBEAEA;--s-draft-bg:#EEF1F1;--s-warn-bg:#FDF0E6;
  --shadow:0 1px 2px rgba(16,40,44,.06),0 4px 16px rgba(16,40,44,.06);
  --r:6px;--rc:10px;
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --primary:#3FB8C1;--primary-strong:#62CAD2;--primary-soft:#133A3E;--on-primary:#062326;
  --bg:#0F1719;--surface:#172225;--surface-2:#1B282B;--border:#2A393C;--text:#E4ECED;--muted:#93A7AB;
  --s-draft:#A3B1B3;--s-wait:#E3AE5B;--s-ok:#7DB0EA;--s-done:#6BC795;--s-bad:#F08080;--s-warn:#F2A15E;
  --s-wait-bg:#3A2E17;--s-ok-bg:#1B2C42;--s-done-bg:#17332A;--s-bad-bg:#3E1D1D;--s-draft-bg:#243033;--s-warn-bg:#3C2A1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --primary:#3FB8C1;--primary-strong:#62CAD2;--primary-soft:#133A3E;--on-primary:#062326;
  --bg:#0F1719;--surface:#172225;--surface-2:#1B282B;--border:#2A393C;--text:#E4ECED;--muted:#93A7AB;
  --s-draft:#A3B1B3;--s-wait:#E3AE5B;--s-ok:#7DB0EA;--s-done:#6BC795;--s-bad:#F08080;--s-warn:#F2A15E;
  --s-wait-bg:#3A2E17;--s-ok-bg:#1B2C42;--s-done-bg:#17332A;--s-bad-bg:#3E1D1D;--s-draft-bg:#243033;--s-warn-bg:#3C2A1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:inherit;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:22px;font-weight:700}
h2{font-size:16px;font-weight:600}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:16px;border-bottom:1px solid var(--border)}
.logo{width:34px;height:34px;border-radius:8px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;flex:none}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;padding:12px 8px;overflow:auto;flex:1}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:var(--r);text-decoration:none;color:var(--text);font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--primary-soft);color:var(--primary-strong)}
.nav .cnt{background:var(--s-wait-bg);color:var(--s-wait);border-radius:10px;padding:0 7px;font-size:12px;font-weight:600}
.nav .sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.me{padding:12px 16px;border-top:1px solid var(--border);display:grid;gap:8px}
.me label{font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:56px;display:flex;align-items:center;gap:12px;padding-inline:24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumb{color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--text);font-weight:600}
.search{width:240px;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface-2)}
.bell{position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.bell i{position:absolute;top:-4px;right:-4px;background:var(--s-bad);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 5px;font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary-strong);display:grid;place-items:center;font-weight:600}
.content{padding:24px;display:grid;gap:16px;align-content:start}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* components */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rc)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-b{padding:16px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:7px 14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.p{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.p:hover{background:var(--primary-strong)}
.btn.d{color:var(--s-bad);border-color:currentColor;background:transparent}
.btn.g{border-color:transparent;background:transparent;color:var(--primary)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-draft{color:var(--s-draft);background:var(--s-draft-bg)}
.b-wait{color:var(--s-wait);background:var(--s-wait-bg)}
.b-ok{color:var(--s-ok);background:var(--s-ok-bg)}
.b-done{color:var(--s-done);background:var(--s-done-bg)}
.b-bad{color:var(--s-bad);background:var(--s-bad-bg)}
.b-warn{color:var(--s-warn);background:var(--s-warn-bg)}
.chip{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;border:1px solid var(--border);color:var(--muted)}
.chip.lanh{color:var(--s-ok);border-color:currentColor}
.chip.mat{color:var(--primary);border-color:currentColor}
.chip.fefo{color:var(--s-done);border-color:currentColor;font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
tr.sub td{background:var(--bg);font-size:13px}
tr.sub td:first-child{padding-left:32px}
tfoot td{font-weight:700;background:var(--surface-2)}
.red{color:var(--s-bad);font-weight:600}.orange{color:var(--s-warn);font-weight:600}
input.f,select.f,textarea.f{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
input.f.bad{border-color:var(--s-bad);background:var(--s-bad-bg)}
input.qty{width:90px;text-align:right}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.kpi{padding:16px;display:grid;gap:4px;cursor:pointer;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--rc)}
.kpi:hover{border-color:var(--primary)}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{font-size:12px}
.kpi.wait b{color:var(--s-wait)}.kpi.bad b{color:var(--s-bad)}.kpi.warn b{color:var(--s-warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding-inline:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.tabs em{font-style:normal;font-size:12px;background:var(--surface-2);border-radius:9px;padding:0 6px;margin-left:4px}
.alert{padding:10px 14px;border-radius:var(--r);border:1px solid;font-size:13px}
.alert.warn{color:var(--s-wait);background:var(--s-wait-bg)}
.alert.info{color:var(--s-ok);background:var(--s-ok-bg)}
.alert.bad{color:var(--s-bad);background:var(--s-bad-bg)}
.timeline{list-style:none;margin:0;padding:0;display:grid}
.timeline li{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:18px}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--border)}
.timeline li.done:not(:last-child)::after{background:var(--s-done)}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
li.done .dot{background:var(--s-done);border-color:var(--s-done);color:#fff}
li.cur .dot{border-color:var(--s-wait);color:var(--s-wait)}
li.rej .dot{background:var(--s-bad);border-color:var(--s-bad);color:#fff}
.timeline b{display:block;font-weight:600}
.timeline small{color:var(--muted)}
.empty{padding:32px;text-align:center;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.meta div span{display:block;font-size:12px;color:var(--muted)}
.meta div b{font-weight:600}
.stepbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.stepbar span{padding:3px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border)}
.stepbar span.on{background:var(--primary-soft);color:var(--primary-strong);border-color:var(--primary)}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.login .hero{background:var(--primary);color:var(--on-primary);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.login .hero h1{font-size:32px;max-width:14ch}
.login .hero p{max-width:44ch;opacity:.9}
.login .hero .logo{background:var(--on-primary);color:var(--primary)}
.login .form{display:grid;place-items:center;padding:48px 24px;background:var(--surface)}
.login form{width:100%;max-width:360px;display:grid;gap:14px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick .btn{text-align:left;white-space:normal}
.quick .btn small{display:block;color:var(--muted);font-weight:400;font-size:12px}

/* print */
.paper{background:#fff;color:#111;max-width:794px;margin-inline:auto;padding:48px 56px;box-shadow:var(--shadow);border-radius:4px;font-size:13px}
.paper table th,.paper table td{border:1px solid #444;padding:6px 8px;background:#fff;color:#111}
.paper .hd{display:flex;justify-content:space-between;gap:16px;text-transform:uppercase;font-size:12px}
.paper h2{text-align:center;font-size:18px;margin:24px 0 4px;text-transform:uppercase}
.paper .c{text-align:center}
.sign{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:32px;gap:8px}
.sign b{display:block}
.sign i{display:block;font-size:12px;color:#555;margin-bottom:56px}

/* overlay */
.ov{position:fixed;inset:0;background:rgba(10,25,28,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:var(--rc);width:100%;max-width:460px;box-shadow:var(--shadow);display:grid;gap:14px;padding:20px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:51;padding:20px;display:grid;gap:14px;align-content:start;overflow:auto;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.demo{background:var(--primary-soft);border:1px dashed var(--primary);color:var(--primary-strong);border-radius:var(--rc);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.demo b{font-weight:700}

@media (max-width:1000px){
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.cols2{grid-template-columns:1fr}
  .meta{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}
  .nav{flex-direction:row;overflow-x:auto;padding:8px 16px}
  .nav .sec{display:none}
  .nav a{white-space:nowrap;gap:6px}
  .me{grid-template-columns:1fr;padding-inline:16px}
  .brand{padding-inline:16px}
  .top{padding-inline:16px;position:static}
  .search{display:none}
  .content{padding:16px}
  .login{grid-template-columns:1fr}
  .login .hero{padding:32px 16px}
  .paper{padding:24px 16px}
  .quick{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.btn,.kpi,.nav a{transition:background .15s,border-color .15s}}
</style>

<div id="root"></div>

<script>
const TODAY = new Date('2026-09-24T00:00:00');
const ROLES = {
  dd:  {name:'Nguyễn Thị Lan', title:'ĐD khoa – Khoa Nội', short:'NL'},
  kho: {name:'Trần Văn Hùng', title:'Thủ kho – P.VTTBYT', short:'TH'},
  tp:  {name:'Lê Thị Kim Hạnh', title:'Trưởng P.VTTBYT', short:'KH'},
  kt:  {name:'Phạm Minh Tuấn', title:'Kế toán dược – P.TCKT', short:'MT'},
};
const ITEMS = [
  {ma:'VT001',ten:'Bơm tiêm 5ml',dvt:'Cái',nhom:'Tiêm truyền',bq:'Phòng',sodk:'2100345ĐKLH',gia:1150,min:500,avg:950,bn:1500,bx:1100},
  {ma:'VT002',ten:'Găng tay khám size M',dvt:'Hộp',nhom:'Bảo hộ',bq:'Phòng',sodk:'2200871ĐKLH',gia:68000,min:40,avg:70,bn:60,bx:74},
  {ma:'VT003',ten:'Bông y tế 1kg',dvt:'Gói',nhom:'Băng gạc',bq:'Phòng',sodk:'2000112ĐKLH',gia:145000,min:10,avg:9,bn:10,bx:8},
  {ma:'VT004',ten:'Kim luồn tĩnh mạch 22G',dvt:'Cái',nhom:'Tiêm truyền',bq:'Phòng',sodk:'2300764ĐKLH',gia:9800,min:200,avg:230,bn:0,bx:240},
  {ma:'VT005',ten:'Dây truyền dịch',dvt:'Bộ',nhom:'Tiêm truyền',bq:'Phòng',sodk:'2100998ĐKLH',gia:5200,min:300,avg:310,bn:400,bx:330},
  {ma:'VT006',ten:'Que thử đường huyết',dvt:'Hộp',nhom:'Xét nghiệm',bq:'Mát',sodk:'2201450ĐKLH',gia:210000,min:15,avg:14,bn:0,bx:12},
  {ma:'HC001',ten:'Hóa chất xét nghiệm Glucose',dvt:'Lọ',nhom:'Hóa chất',bq:'Lạnh',sodk:'2305521ĐKLH',gia:1350000,min:4,avg:3,bn:4,bx:3},
];
const S = {
  role:null, route:'dashboard', sel:null, tab:'all', vtq:'', vtNhom:'', khoFilter:'Kho chính', reportMonth:'09/2026',
  lots:[
    {ma:'VT001',lo:'BT2402',hsd:'2026-11-20',sl:800,vt:'A1-02'},
    {ma:'VT001',lo:'BT2409',hsd:'2027-08-15',sl:1500,vt:'A1-03'},
    {ma:'VT002',lo:'GT2310',hsd:'2026-10-12',sl:25,vt:'B2-01'},
    {ma:'VT002',lo:'GT2405',hsd:'2027-05-01',sl:60,vt:'B2-02'},
    {ma:'VT003',lo:'BG2401',hsd:'2027-01-30',sl:18,vt:'C1-01'},
    {ma:'VT004',lo:'KL2311',hsd:'2026-12-05',sl:150,vt:'A2-01'},
    {ma:'VT005',lo:'DT2406',hsd:'2027-06-30',sl:420,vt:'A2-04'},
    {ma:'VT006',lo:'QT2403',hsd:'2026-10-08',sl:12,vt:'Tủ mát 1'},
    {ma:'HC001',lo:'HC2405',hsd:'2027-02-28',sl:6,vt:'Tủ lạnh 2'},
    {ma:'VT004',lo:'KL2208',hsd:'2026-10-02',sl:30,vt:'Biệt trữ',q:true},
  ],
  moves:[], // {ma, type:'N'|'X', sl}
  seq:13,
  slips:[
    mk('PL-2026-0009','Khoa Cấp cứu','2026-09-15','done',[['VT001',200],['VT005',60]],'Phạm Thu Hà'),
    mk('PL-2026-0010','Khoa Ngoại','2026-09-19','done',[['VT002',10],['VT003',2]],'Võ Minh Khôi'),
    mk('PL-2026-0011','Khoa Sản','2026-09-22','bad',[['VT004',100]],'Đặng Ngọc Mai','Số lượng vượt định mức tháng, đề nghị lập lại'),
    mk('PL-2026-0012','Khoa Nội','2026-09-23','cho_xn',[['VT001',300],['VT002',8],['VT006',4]],'Nguyễn Thị Lan'),
    mk('PL-2026-0013','Khoa Xét nghiệm','2026-09-24','cho_duyet',[['HC001',2],['VT006',3]],'Lý Văn Tâm'),
  ],
  draft:null, alloc:null, modal:null, drawer:null, toast:null, nhap:null, dutru:null,
};
function mk(so,khoa,ngay,st,lines,nguoi,lydo){
  const h=[{a:'Lập phiếu',by:nguoi,t:ngay+' 08:10'},{a:'Trưởng khoa duyệt',by:'Trưởng '+khoa.replace('Khoa ','khoa '),t:ngay+' 09:02'}];
  if(['cho_duyet','da_duyet','done','bad'].includes(st)) h.push({a:'Kho xác nhận',by:'Trần Văn Hùng',t:ngay+' 10:15'});
  if(['da_duyet','done'].includes(st)) h.push({a:'Trưởng P.VTTBYT duyệt',by:'Lê Thị Kim Hạnh',t:ngay+' 14:30'});
  if(st==='bad') h.push({a:'Từ chối',by:'Lê Thị Kim Hạnh',t:ngay+' 14:30',rej:true,note:lydo});
  if(st==='done') h.push({a:'Cấp phát',by:'Trần Văn Hùng',t:ngay+' 15:40'});
  return {so,khoa,ngay,st,nguoi,lines:lines.map(([ma,sl])=>({ma,sl,phat:st==='done'?sl:0})),hist:h,xuat:st==='done'?'CTX-'+so.slice(3):null,alloc:null};
}
const ST = {
  draft:['Nháp','b-draft'], cho_xn:['Chờ kho xác nhận','b-wait'], cho_duyet:['Chờ duyệt','b-wait'],
  da_duyet:['Đã duyệt','b-ok'], done:['Đã cấp phát','b-done'], bad:['Từ chối','b-bad'],
};
const item = ma => ITEMS.find(i=>i.ma===ma);
const nf = n => Number(n).toLocaleString('vi-VN');
const money = n => nf(Math.round(n))+' ₫';
const dfmt = s => { const [y,m,d]=s.slice(0,10).split('-'); return `${d}/${m}/${y}`; };
const daysLeft = s => Math.round((new Date(s+'T00:00:00')-TODAY)/864e5);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge = st => `<span class="badge ${ST[st][1]}">${ST[st][0]}</span>`;
const stock = ma => S.lots.filter(l=>l.ma===ma&&!l.q).reduce((a,l)=>a+l.sl,0);
const hsdCls = s => { const d=daysLeft(s); return d<30?'red':d<90?'orange':''; };
const slip = so => S.slips.find(s=>s.so===so);

function fefo(ma, need){
  const lots=S.lots.filter(l=>l.ma===ma&&!l.q&&l.sl>0).sort((a,b)=>a.hsd.localeCompare(b.hsd));
  const out=[]; let rest=need;
  for(const l of lots){ if(rest<=0)break; const take=Math.min(l.sl,rest); out.push({lo:l.lo,hsd:l.hsd,sl:take}); rest-=take; }
  return {out,short:rest};
}

function myQueue(){
  if(S.role==='kho') return S.slips.filter(s=>s.st==='cho_xn'||s.st==='da_duyet');
  if(S.role==='tp') return S.slips.filter(s=>s.st==='cho_duyet');
  if(S.role==='dd') return S.slips.filter(s=>s.khoa==='Khoa Nội'&&s.st!=='done');
  return [];
}
function countFor(){ const n=myQueue().length; return n; }
function visibleSlips(){ return S.role==='dd'?S.slips.filter(s=>s.khoa==='Khoa Nội'):S.slips; }

function go(r,sel){ S.route=r; if(sel!==undefined)S.sel=sel; try{history.replaceState(null,'','#'+r)}catch(e){} render(); window.scrollTo(0,0); }
function toast(m){ S.toast=m; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{S.toast=null;render()},2600); }

function xnt(){
  return ITEMS.map(i=>{
    const cuoi=S.lots.filter(l=>l.ma===i.ma&&!l.q).reduce((a,l)=>a+l.sl,0);
    const n=i.bn+S.moves.filter(m=>m.ma===i.ma&&m.type==='N').reduce((a,m)=>a+m.sl,0);
    const x=i.bx+S.moves.filter(m=>m.ma===i.ma&&m.type==='X').reduce((a,m)=>a+m.sl,0);
    return {i,dau:cuoi-n+x,n,x,cuoi};
  });
}

    S.draft=null; toast(`Đã gửi ${so}. Trưởng khoa đã duyệt, phiếu chuyển đến kho.`); go('chitiet',so);
  },
  confirm:e=>{const s=slip(e.dataset.so);s.st='cho_duyet';s.hist.push({a:'Kho xác nhận',by:ROLES.kho.name,t:now()});toast('Đã xác nhận, chuyển Trưởng P.VTTBYT duyệt');render();},
  return:e=>{toast('Đã trả phiếu về khoa để chỉnh sửa (demo)');},
  approve:e=>{const s=slip(e.dataset.so);s.st='da_duyet';s.hist.push({a:'Trưởng P.VTTBYT duyệt',by:ROLES.tp.name,t:now()});toast('Đã duyệt phiếu. Kho có thể cấp phát.');render();},
  rejectOpen:e=>{S.modal={so:e.dataset.so,reason:''};render();setTimeout(()=>{const t=document.getElementById('rejReason');t&&t.focus()});},
  rejectDo:()=>{const m=S.modal;m.reason=document.getElementById('rejReason').value.trim();if(!m.reason){m.err=true;return render();}
    const s=slip(m.so);s.st='bad';s.hist.push({a:'Từ chối',by:ROLES.tp.name,t:now(),rej:true,note:m.reason});S.modal=null;toast('Đã từ chối phiếu '+s.so);render();},
  closeOv:()=>{S.modal=null;S.drawer=null;render();},
  toAlloc:e=>go('capphat',e.dataset.so),
  pickAlloc:e=>{S.sel=e.dataset.so;render();},
  doAlloc:e=>{const s=slip(e.dataset.so);
    s.alloc=s.lines.map(l=>fefo(l.ma,l.sl));
    s.alloc.forEach((a,i)=>{a.out.forEach(o=>{const lot=S.lots.find(x=>x.ma===s.lines[i].ma&&x.lo===o.lo);lot.sl-=o.sl;});
      s.lines[i].phat=a.out.reduce((t,o)=>t+o.sl,0); S.moves.push({ma:s.lines[i].ma,type:'X',sl:s.lines[i].phat});});
    S.lots=S.lots.filter(l=>l.sl>0||l.q);
    s.st='done';s.xuat='CTX-'+s.so.slice(3);s.hist.push({a:'Cấp phát',by:ROLES.kho.name,t:now()});
    toast('Đã cấp phát và trừ tồn kho theo lô');go('inchungtu',s.so);},
  print:e=>go('inchungtu',e.dataset.so),
  toggleOk:e=>{const l=S.nhap.lines[+e.dataset.i];l.ok=!l.ok;render();},
  doNhap:()=>{S.nhap.lines.forEach(l=>{ if(l.ok){S.lots.push({ma:l.ma,lo:l.lo,hsd:l.hsd,sl:l.sl,vt:'Khu nhận hàng'});S.moves.push({ma:l.ma,type:'N',sl:l.sl});}
      else S.lots.push({ma:l.ma,lo:l.lo,hsd:l.hsd,sl:l.sl,vt:'Biệt trữ',q:true}); });
    S.nhap.done=true;toast('Đã nhập kho. Hàng không đạt chuyển khu biệt trữ.');render();},
  resetNhap:()=>{S.nhap=null;render();},
  excel:()=>toast('Trong ứng dụng thật: tải file BaoCao_XNT_09-2026.xlsx'),
  sendDutru:()=>toast('Đã gửi dự trù đột xuất tháng 10/2026 để Trưởng P.VTTBYT duyệt'),
  drawerNew:()=>{S.drawer={};render();},
  drawerEdit:e=>{S.drawer={ma:e.dataset.ma};render();},
  saveItem:()=>{S.drawer=null;toast('Đã lưu vật tư (demo)');render();},
};
document.addEventListener('click',ev=>{
  const g=ev.target.closest('[data-go]'); if(g){ev.preventDefault();return go(g.dataset.go);}
  const a=ev.target.closest('[data-a]'); if(a&&A[a.dataset.a]){ if(a.classList.contains('ov')&&ev.target!==a)return; ev.preventDefault(); A[a.dataset.a](a); }
});
document.addEventListener('submit',ev=>{ev.preventDefault();S.role='kho';go('dashboard');});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&(S.modal||S.drawer)) A.closeOv(); });
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='vtq'){S.vtq=t.value;render();}
  else if(t.dataset.line!=null&&t.dataset.k==='sl'){S.draft.lines[+t.dataset.line].sl=t.value;}
  else if(t.dataset.nl!=null){S.nhap.lines[+t.dataset.nl].gia=+t.value;}
  else if(t.dataset.dt){S.dutru[t.dataset.dt]=+t.value;}
  else if(t.id==='lydo'){S.draft.lydo=t.value;}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='roleSel'){S.role=t.value;S.route='dashboard';render();}
  else if(t.id==='vtNhom'){S.vtNhom=t.value;render();}
  else if(t.id==='khoFilter'){S.khoFilter=t.value;render();}
  else if(t.dataset.line!=null){S.draft.lines[+t.dataset.line][t.dataset.k]=t.value;render();}
  else if(t.dataset.nl!=null||t.dataset.line!=null&&t.dataset.k==='sl'){render();}
});
const h=(location.hash||'').slice(1);
if(h&&VIEWS[h]){S.role='kho';S.route=h;}
render();
</script>
